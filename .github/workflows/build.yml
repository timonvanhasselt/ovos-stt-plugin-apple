name: Build and Release Apple STT Helper

on:
  push:
    tags:
      - 'v*' # Triggers the workflow on push events matching tags starting with 'v' (e.g. v0.1.0)

jobs:
  build:
    name: Build Helper (${{ matrix.arch }})
    runs-on: macos-latest
    strategy:
      matrix:
        include:
          - arch: arm64
            swift-arch: arm64
          - arch: x86_64
            swift-arch: x86_64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest

      - name: Compile Swift binary for ${{ matrix.arch }}
        run: |
          cd ovos_stt_apple/swift
          # Compile directly for target architecture
          swiftc -O main.swift -o ../../apple-stt-helper-${{ matrix.arch }} \
            -target ${{ matrix.swift-arch }}-apple-macos11.0 \
            -Xlinker -sectcreate -Xlinker __TEXT \
            -Xlinker __info_plist -Xlinker Info.plist

          # Sign the binary locally
          codesign --force --sign - ../../apple-stt-helper-${{ matrix.arch }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: helper-${{ matrix.arch }}
          path: apple-stt-helper-*

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release files
        run: |
          mkdir release_assets
          # Move artifacts to the release directory
          mv artifacts/helper-arm64/apple-stt-helper-arm64 release_assets/
          mv artifacts/helper-x86_64/apple-stt-helper-x86_64 release_assets/
          
          cd release_assets
          # Generate SHA256 checksums required by build.py
          sha256sum apple-stt-helper-* > SHA256SUMS
          cat SHA256SUMS

      - name: Create GitHub Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release_assets/apple-stt-helper-arm64
            release_assets/apple-stt-helper-x86_64
            release_assets/SHA256SUMS
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
